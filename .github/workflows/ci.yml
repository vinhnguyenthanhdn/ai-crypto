name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q src scripts

      - name: Regression suite (every scripts/test_*.py)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test file matched scripts/test_*.py — the suite must never be empty."
            exit 1
          fi
          failed=()
          for f in "${files[@]}"; do
            echo "::group::$f"
            if python "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          echo "Ran ${#files[@]} test file(s), ${#failed[@]} failed."
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'FAILED: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Whitespace and conflict markers
        run: git diff --check "$(git rev-list --max-parents=0 HEAD | tail -1)"..HEAD

  scope-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Removed public definitions must be named in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/scope_guard.py "$BASE_SHA" "$HEAD_SHA"

  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed credentials, datasets and databases
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -Ei '^\.env$|dashboard_secret|config/paper\.env|\.db$|^data/backtests/|\.pem$|\.key$' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No credentials, databases or datasets tracked."
