name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Every tracked .py, not two directory names. `src scripts` left
      # tests/fixtures/composite_forward/generate_fixtures.py — the script that
      # regenerates a committed fixture — compiled by nothing, and a syntax
      # error in it passed this step. A scan that finds nothing is broken, not
      # clean, so the count is asserted too.
      - name: Compile all sources
        run: |
          set -euo pipefail
          mapfile -t sources < <(git ls-files '*.py')
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No tracked .py file matched — this step would be a no-op."
            exit 1
          fi
          python -m compileall -q "${sources[@]}"
          echo "Compiled ${#sources[@]} tracked Python file(s)."

      # compileall answers "does this parse". It says nothing about a name that
      # resolves to nothing, because Python resolves names when the line runs —
      # and the line that never ran here was a cleanup guard in a test, so its
      # failure was invisible by construction. flake8's F class is the smallest
      # set that catches that: undefined names (F821), unused imports (F4) and
      # values computed and thrown away (F841). It is scoped to F on purpose;
      # the style codes are a different argument and would drown this one.
      - name: Reject undefined names, unused imports and dead assignments
        run: |
          set -euo pipefail
          mapfile -t sources < <(git ls-files '*.py')
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No tracked .py file matched — this step would be a no-op."
            exit 1
          fi
          pip install flake8
          flake8 --select=F "${sources[@]}"
          echo "Checked ${#sources[@]} tracked Python file(s) for F-class findings."

      - name: Reject test files outside scripts/
        run: |
          set -euo pipefail
          misplaced=()
          while IFS= read -r -d '' f; do
            misplaced+=("${f#./}")
          done < <(find . -type f -name 'test_*.py' ! -path './scripts/*' ! -path './.git/*' -print0)

          if [ ${#misplaced[@]} -gt 0 ]; then
            for f in "${misplaced[@]}"; do
              echo "$f is named like a test but lives outside scripts/, so the regression suite never runs it. Move it to scripts/ or rename it."
            done
            exit 1
          fi
          echo "No test_*.py files found outside scripts/."

      - name: Regression suite (every scripts/test_*.py)
        run: bash scripts/run_suite.sh

      - name: Whitespace and conflict markers
        run: git diff --check "$(git rev-list --max-parents=0 HEAD | tail -1)"..HEAD

  scope-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Removed public definitions must be named in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/scope_guard.py "$BASE_SHA" "$HEAD_SHA"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t ai-crypto:ci .

      - name: The image runs the suite with no network and no credentials
        run: |
          set -euo pipefail
          docker run --rm --network none ai-crypto:ci | tee run.log
          expected=$(ls scripts/test_*.py | wc -l | tr -d ' ')
          grep -qx "Ran ${expected} test file(s), 0 failed." run.log

      - name: The image does not run as root and cannot write its own code
        run: |
          set -euo pipefail
          test "$(docker run --rm ai-crypto:ci id -u)" != "0"
          ! docker run --rm ai-crypto:ci sh -c 'echo x >> /app/src/config.py'

      - name: The image carries no configuration and no data
        run: |
          set -euo pipefail
          test -z "$(docker run --rm ai-crypto:ci ls -A /app/config)"
          ! docker run --rm ai-crypto:ci sh -c 'test -e /app/data'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The service comes up and reports healthy
        run: |
          set -euo pipefail
          # --wait blocks until every service with a healthcheck is healthy and
          # exits non-zero if one never gets there, so the gate is the runtime's
          # verdict rather than a sleep followed by a hopeful curl.
          docker compose up -d --wait --wait-timeout 180

      - name: The runtime agrees it is healthy, and it answers on the published port
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q dashboard)
          state=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
          echo "health=$state"
          test "$state" = "healthy"

          # Independent of the probe: reach it the way a user would, from
          # outside the container, through the published port.
          body=$(curl -fsS --max-time 10 http://127.0.0.1:8787/api/session)
          echo "body=$body"
          test "$body" = '{"authed":false}'

      - name: The secret lives in the volume, not in the source tree
        run: |
          set -euo pipefail
          docker compose exec -T dashboard test -s /app/config/dashboard_secret.json
          # The same path on the checkout must stay empty: a mounted volume that
          # silently resolved to a bind mount would write a credential into the
          # working tree, and guard-secrets only sees what is committed.
          test ! -e config/dashboard_secret.json

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Every template under infra/ validates
        run: |
          set -euo pipefail
          # Collection is a glob over what is tracked, not a list of filenames,
          # and an empty result is a failure — a step that lints nothing must
          # not be able to report success.
          mapfile -t templates < <(git ls-files 'infra/*.yaml' 'infra/*.yml')
          if [ ${#templates[@]} -eq 0 ]; then
            echo "No template matched infra/*.y*ml — this step would be a no-op."
            exit 1
          fi
          printf 'Linting %s\n' "${templates[@]}"
          cfn-lint "${templates[@]}"

      - name: The linter rejects a template it should reject
        run: |
          set -euo pipefail
          # A green lint means nothing unless the linter can go red. Break one
          # reference and require the failure, on every run rather than once.
          broken="$RUNNER_TEMP/broken.yaml"
          sed 's/!GetAtt Cluster.Arn/!GetAtt NoSuchCluster.Arn/' \
            infra/scheduled-task.yaml > "$broken"
          if cfn-lint "$broken"; then
            echo "cfn-lint accepted a dangling reference, so the step above proves nothing."
            exit 1
          fi
          echo "cfn-lint rejects a dangling reference, as required."

  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject committed credentials, datasets and databases
        run: bash scripts/guard_secrets.sh .

      - name: The guard still fires on a tree it should reject
        # This scan passes on every run and always will: none of the names it
        # refuses can appear in a repository that has never committed one, so a
        # pass says nothing about whether it can still fail. Plant one file per
        # alternative in a scratch repository and require a rejection for each,
        # every run rather than by hand once.
        run: bash scripts/guard_secrets.sh --self-test

  # The README says scheduled paper trading runs under launchd on macOS. Every
  # other job here is `ubuntu-latest`, so the one platform the schedule actually
  # targets had never run a single step. This job hands the committed job
  # definition to launchd on macOS and asks launchd whether it accepted it.
  launchd:
    runs-on: macos-latest
    env:
      LABEL: com.ai-crypto.funding-crowding-forward
      AUTHOR_ROOT: /Users/administrator/Library/Application Support/ai-crypto-funding-forward
    steps:
      - uses: actions/checkout@v7

      # Without a gui domain there is nothing to bootstrap into and every
      # assertion below would pass vacuously. Fail here instead.
      - name: The runner must have a launchd gui domain
        run: launchctl print "gui/$(id -u)" > /dev/null

      - name: The committed plist must be a well-formed property list
        run: plutil -lint config/${{ env.LABEL }}.plist

      - name: launchd must accept the committed job definition
        run: |
          set -euo pipefail
          uid="$(id -u)"
          root="$HOME/ai-crypto-ci-launchd"
          agent="$HOME/Library/LaunchAgents/$LABEL.plist"
          mkdir -p "$root/scripts" "$root/logs" "$HOME/Library/LaunchAgents"

          # The committed plist hard-codes the author's home directory, which is
          # the portability limit the README states. Retarget only that prefix;
          # everything else about the job definition is tested as shipped.
          python3 - "$AUTHOR_ROOT" "$root" <<'PY' > "$agent"
          import sys
          src, dst = sys.argv[1], sys.argv[2]
          text = open('config/com.ai-crypto.funding-crowding-forward.plist').read()
          assert src in text, 'the author path prefix is gone; this step needs updating'
          sys.stdout.write(text.replace(src, dst))
          PY
          printf '#!/bin/bash\nexit 0\n' > "$root/scripts/run_funding_crowding_forward_paper.sh"
          chmod +x "$root/scripts/run_funding_crowding_forward_paper.sh"

          # RunAtLoad would start the real observer on bootstrap; this gate is
          # about whether launchd accepts the schedule, not about running it.
          plutil -remove RunAtLoad "$agent"
          plutil -lint "$agent"

          # Negative evidence: the print below must be able to find nothing.
          launchctl bootout "gui/$uid/$LABEL" >/dev/null 2>&1 || true
          if launchctl print "gui/$uid/$LABEL" >/dev/null 2>&1; then
            echo "::error::the label was already loaded before bootstrap ran"
            exit 1
          fi

          launchctl bootstrap "gui/$uid" "$agent"

          # Ask launchd, not the file. plutil only proves the XML parses.
          launchctl print "gui/$uid/$LABEL" > loaded.txt
          echo "--- launchd's own view of the job:"
          cat loaded.txt
          grep -q "path = $agent" loaded.txt
          grep -q "$root/scripts/run_funding_crowding_forward_paper.sh" loaded.txt
          grep -q "working directory = $root" loaded.txt
          grep -q "$root/logs/funding_crowding_forward.log" loaded.txt
          # The schedule is the whole claim. A job launchd accepted but did not
          # register a calendar interval for would never fire.
          grep -qi 'calendarinterval\|next fire' loaded.txt

          launchctl bootout "gui/$uid/$LABEL"
          if launchctl print "gui/$uid/$LABEL" >/dev/null 2>&1; then
            echo "::error::the job survived bootout"
            exit 1
          fi
