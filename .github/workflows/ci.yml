name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q src scripts

      - name: Scoring regression
        run: python scripts/test_scoring.py

      - name: Support/resistance regression
        run: python scripts/test_sr_scoring.py

      - name: Whitespace and conflict markers
        run: git diff --check "$(git rev-list --max-parents=0 HEAD | tail -1)"..HEAD

  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed credentials, datasets and databases
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -Ei '^\.env$|dashboard_secret|config/paper\.env|\.db$|^data/backtests/|\.pem$|\.key$' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No credentials, databases or datasets tracked."
