name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q src scripts

      - name: Reject test files outside scripts/
        run: |
          set -euo pipefail
          misplaced=()
          while IFS= read -r -d '' f; do
            misplaced+=("${f#./}")
          done < <(find . -type f -name 'test_*.py' ! -path './scripts/*' ! -path './.git/*' -print0)

          if [ ${#misplaced[@]} -gt 0 ]; then
            for f in "${misplaced[@]}"; do
              echo "$f is named like a test but lives outside scripts/, so the regression suite never runs it. Move it to scripts/ or rename it."
            done
            exit 1
          fi
          echo "No test_*.py files found outside scripts/."

      - name: Regression suite (every scripts/test_*.py)
        run: bash scripts/run_suite.sh

      - name: Whitespace and conflict markers
        run: git diff --check "$(git rev-list --max-parents=0 HEAD | tail -1)"..HEAD

  scope-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Removed public definitions must be named in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/scope_guard.py "$BASE_SHA" "$HEAD_SHA"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ai-crypto:ci .

      - name: The image runs the suite with no network and no credentials
        run: |
          set -euo pipefail
          docker run --rm --network none ai-crypto:ci | tee run.log
          expected=$(ls scripts/test_*.py | wc -l | tr -d ' ')
          grep -qx "Ran ${expected} test file(s), 0 failed." run.log

      - name: The image does not run as root and cannot write its own code
        run: |
          set -euo pipefail
          test "$(docker run --rm ai-crypto:ci id -u)" != "0"
          ! docker run --rm ai-crypto:ci sh -c 'echo x >> /app/src/config.py'

      - name: The image carries no configuration or data directory
        run: |
          set -euo pipefail
          ! docker run --rm ai-crypto:ci sh -c 'test -e /app/config -o -e /app/data'

  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed credentials, datasets and databases
        run: |
          set -euo pipefail
          bad=$(git ls-files \
            | grep -Ei '^\.env$|dashboard_secret|config/paper\.env|\.db$|^data/backtests/|\.pem$|\.key$' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No credentials, databases or datasets tracked."
